[pytest]
# Tesztinfrastruktúra-beállítás (2026-11-22, tesztalapvonal):
# - testpaths: a gyűjtés csak a tests/ mappára terjed ki (scripts/, data/ és a
#   gyökérben lévő *_demo.py fájlok nem kerülnek tesztként gyűjtésre).
# - --import-mode=importlib: a tests/test_retrieval.py és a
#   tests/test_textus_kb/test_retrieval.py (valamint a két test_quality_gate.py)
#   azonos alapnevű, __init__.py nélküli modulok; az alapértelmezett "prepend"
#   módban a gyűjtés "import file mismatch" hibával leáll.
# - pythonpath = .: a projektgyökér akkor is a sys.path-on van, ha a pytest
#   parancsot nem "python -m pytest" formában indítják (sok teszt
#   "from tests.… import …" formában hivatkozik segédfüggvényekre).
testpaths = tests
addopts = --import-mode=importlib
pythonpath = .
