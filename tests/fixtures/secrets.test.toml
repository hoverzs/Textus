# Tesztkörnyezet titokfájlja — szándékosan NEM valódi kulcsok.
#
# A tests/conftest.py a Streamlit "secrets.files" beállítását kizárólag erre a
# fájlra rögzíti, így a tesztek sem a projekt saját .streamlit/secrets.toml-ját,
# sem a felhasználói szintű %USERPROFILE%\.streamlit\secrets.toml-t nem látják
# (abban éles Supabase- és bejelentkezési adatok lehetnek).
#
# SZENTIRAS_EU_API_KEY: a RÚF-szolgáltatás a HTTP-kérés ELŐTT ellenőrzi, hogy van-e
# kulcs. Több teszt mockolt HTTP-válasszal (tests/fixtures/ruf/) teszteli a
# feldolgozást; ezek eddig csak olyan gépen futottak le, ahol valódi kulcs volt
# beállítva. Az álkulcs ezt a rejtett környezeti függést szünteti meg; valódi
# hálózati kérést nem tesz lehetővé (a szolgáltatás érvénytelen kulcsot kapna).
# A "nincs kulcs" ágat vizsgáló tesztek a kulcsot maguk távolítják el
# (lásd tests/test_ruf_bible_service.py).
SZENTIRAS_EU_API_KEY = "textus-test-dummy-key-not-real"
